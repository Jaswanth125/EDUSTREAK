name: edustreak
description: A premium gamified educational ecosystem implementing Retrieval-Augmented Generation (RAG) architecture.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Core
  http: ^1.1.0
  provider: ^6.0.0
  dio: ^5.0.0
  flutter_secure_storage: ^9.0.0

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  firebase_messaging: ^16.0.4

  # UI/UX and utilities used in codebase
  flutter_local_notifications: ^17.2.4
  table_calendar: ^3.1.3
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  file_picker: ^8.0.0
  url_launcher: ^6.3.2
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.2
  uuid: ^4.5.0
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/edustreak_logo.png"
  adaptive_icon_background: "#6366F1"
  adaptive_icon_foreground: "assets/images/edustreak_logo.png"