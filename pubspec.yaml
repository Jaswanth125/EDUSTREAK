name: edustreak
description: A streak-based educational mobile application for students, teachers, parents, and admins.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.9.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  firebase_messaging: ^16.0.4
  firebase_analytics: ^12.0.0

  # State Management
  provider: ^6.1.5+1
  riverpod: ^2.4.9

  # UI & Animations
  flutter_animate: ^4.5.2
  lottie: ^3.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.9

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  image_picker: ^1.1.2
  file_picker: ^6.2.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.0.3
  flutter_local_notifications: ^17.2.2
  http: ^1.2.2

  # Charts
  fl_chart: ^0.68.0

  # Calendar
  table_calendar: ^3.1.2

  # Icons
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/store_badges.json
    - assets/store_avatars.json
    - assets/images/
